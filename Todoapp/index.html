<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Todo List</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

</head>


<body class="light">


<div class="container">


    <!-- TITLE -->
    <h1 class="title">

        TODO LIST

    </h1>



    <!-- TOP BAR -->
    <div class="top-bar">



        <!-- SEARCH -->
        <div class="search-box">

            <input
            type="text"
            id="searchInput"
            placeholder="Search note..."
            >

            <!-- INSERT SEARCH ICON HERE -->
            <span class="search-icon">🔍</span>

        </div>



        <!-- FILTER -->
        <select id="filterSelect">

            <option value="all">ALL</option>

            <option value="active">Active</option>

            <option value="completed">Completed</option>

        </select>



        <!-- THEME BUTTON -->
        <button id="themeToggle">

            <!-- INSERT SUN / MOON ICON HERE -->
            🌙

        </button>



    </div>



    <!-- TASK LIST -->
    <ul id="taskList"></ul>



    <!-- EMPTY STATE -->
    <div id="emptyState">

    <img src="icons/Detective-check-footprint 1.svg" width="200" height="200">


    </div>



</div>



<!-- FLOATING ADD BUTTON -->
<button id="addBtn">

    <!-- INSERT PLUS ICON HERE -->

    +

</button>



<!-- MODAL -->
<div id="modal">


    <div class="modal-content">


        <h2 >NEW NOTE</h2>



        <input
        type="text"
        id="taskInput"
        placeholder="Input your note..."
        >



        <div class="modal-buttons">


            <button id="cancelBtn">

                CANCEL

            </button>



            <button id="applyBtn">

                APPLY

            </button>


        </div>


    </div>


</div>



<script src="script.js"></script>


</body>
</html>
